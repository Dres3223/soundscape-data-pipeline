version: 2

# Tables written by the pipeline (src/soundscape): dbt reads them, never writes them
sources:
  - name: raw
    schema: raw
    description: Raw layer loaded by the Python pipeline, stored as the source describes it.
    tables:
      - name: recordings
        description: One row per ingested recording (soundscape.ingest).
        columns:
          - name: sha256
            description: SHA-256 of the audio file; the idempotency key of the ingestion.
            data_tests: [unique, not_null]
          - name: file_name
            description: Original file name, SITE_YYYYMMDD_HHMMSS.ogg.
            data_tests: [unique, not_null]

      - name: audio_features
        description: Audio features per recording (soundscape.features, loaded by soundscape.load).
        columns:
          - name: sha256
            description: Recording the features belong to.
            data_tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'recordings')
                    field: sha256

      - name: detection_recordings
        description: One row per recording analyzed by BirdNET, with or without detections (soundscape.detections, loaded by soundscape.load).
        columns:
          - name: sha256
            description: Recording analyzed.
            data_tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'recordings')
                    field: sha256
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: [ok, failed]

      - name: bird_detections
        description: BirdNET scores of at least min_confidence, one row per recording, 3-second segment and species.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [sha256, start_s, scientific_name]
        columns:
          - name: sha256
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'detection_recordings')
                    field: sha256
          - name: confidence
            data_tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 1
