# Connection to Postgres. No secrets here: every value comes from the
# environment (the same .env as the pipeline), e.g.
#   uv run --env-file .env --group dbt dbt build --project-dir dbt --profiles-dir dbt
soundscape:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics  # only used by models without their own schema
      threads: 4
