# Local services for the pipeline. Usage:
#   docker compose up -d      start (and create volumes on first run)
#   docker compose ps         check status and health
#   docker compose down       stop (data is kept in the volumes)
# Credentials come from .env (see .env.example).
name: soundscape

# Settings shared by every Airflow service (a YAML anchor, merged with <<:)
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: soundscape-airflow:3.3.2
  # Pipeline settings (credentials, bucket...) for soundscape's Settings
  env_file: .env
  environment: &airflow-common-env
    # Inside the Compose network each service is reached by its name, and
    # "localhost" would be the container itself; these override .env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    S3_ENDPOINT_URL: http://rustfs:9000
    INGEST_SOURCE_DIR: /opt/airflow/data/raw/birdclef/train_soundscapes
    AIRFLOW__CORE__EXECUTOR: LocalExecutor  # tasks run inside the scheduler
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/airflow
    # Encrypts passwords of Airflow connections stored in the metadata database
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    # Signs the tokens the components use to talk to the API server
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/project/src  # live code for the editable install
    - ./data:/opt/airflow/data:ro     # source audio, read-only: tasks never modify it
  depends_on: &airflow-common-depends-on
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # Relational database: one row per recording (metadata) and, later, features
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # 127.0.0.1: reachable only from this machine
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Since Postgres 18 the data lives under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # S3-compatible object storage: raw audio files (swapped for AWS S3 in epic E6)
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"      # S3 API (used by the code)
      # web console (used by people): http://127.0.0.1:9001/rustfs/console/
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: create Airflow's metadata database inside our Postgres
  airflow-db-init:
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command: >
      psql -v ON_ERROR_STOP=1
      -v airflow_password=${AIRFLOW_DB_PASSWORD}
      -v app_db=${POSTGRES_DB}
      -f /sql/create_airflow_db.sql
    volumes:
      - ./docker/postgres/create_airflow_db.sql:/sql/create_airflow_db.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: migrate Airflow's schema and create the admin user
  airflow-init:
    <<: *airflow-common
    # Fails if the migration fails; creates the user only when missing
    entrypoint: /bin/bash
    command:
      - -euc
      - |
        airflow db migrate
        if airflow users list --output plain | grep -qw admin; then
          echo "User admin already exists"
        else
          airflow users create --role Admin --username admin \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Admin --lastname User --email admin@example.com
        fi
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    restart: "no"

  # Web interface and REST API: http://localhost:8080
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Decides what runs when; with LocalExecutor it also runs the tasks
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Parses the files in dags/ into DAGs
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  s3data:
